name: Build TraderMind Electron (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه (مثال: 1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 ساخت نصب‌کننده ویندوز (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Electron build tools (CI only)
        working-directory: artifacts/tradermind
        run: pnpm add -D electron@^36.4.0 electron-builder@^25.1.8 --no-lockfile

      - name: Build Vite renderer
        working-directory: artifacts/tradermind
        run: pnpm run electron:build:vite

      - name: Compile Electron main
        working-directory: artifacts/tradermind
        run: pnpm run electron:compile

      - name: Package installer (NSIS .exe)
        working-directory: artifacts/tradermind
        run: pnpm exec electron-builder --win --config electron-builder.json --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Windows
          path: artifacts/tradermind/dist-electron/*.exe
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/tradermind/dist-electron/*.exe
          name: TraderMind OS ${{ github.ref_name }}
          body: |
            ## TraderMind OS ${{ github.ref_name }}

            ### دانلود
            | پلتفرم | فایل |
            |--------|------|
            | ویندوز ۶۴ بیتی | `TraderMind-Setup-*.exe` |

            ### نصب روی ویندوز
            چون برنامه امضای دیجیتال ندارد، ویندوز هشدار SmartScreen نشان می‌دهد:

            ۱. فایل `.exe` را دانلود کنید
            ۲. روی آن راست‌کلیک کنید → **Properties**
            ۳. تیک **Unblock** را بزنید → **OK**
            ۴. فایل را اجرا کنید؛ اگر باز هشدار SmartScreen دیدید → **More info** → **Run anyway**

            > این هشدار فقط به دلیل نبود امضای دیجیتال است و برنامه کاملاً امن است.

            ---
            برای اطلاعات بیشتر به [CHANGELOG](CHANGELOG.md) مراجعه کنید.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
